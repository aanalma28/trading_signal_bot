version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: liquidity_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: liquidity_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
